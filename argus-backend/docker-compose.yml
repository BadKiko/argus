services:
  chroma:
    image: chromadb/chroma:latest
    environment:
      IS_PERSISTENT: "TRUE"
      ANONYMIZED_TELEMETRY: "FALSE"
    volumes:
      - chroma_data:/data
    restart: unless-stopped
    networks:
      - argus-internal

  api:
    build: .
    env_file: .env
    environment:
      CHROMA_HOST: chroma
      CHROMA_PORT: "8000"
    depends_on:
      - chroma
    volumes:
      - api_data:/data
    ports:
      - "127.0.0.1:8787:8787"
    restart: unless-stopped
    networks:
      - argus-internal
      - arachnel-proxy

volumes:
  chroma_data:
  api_data:

networks:
  argus-internal:
  arachnel-proxy:
    external: true
